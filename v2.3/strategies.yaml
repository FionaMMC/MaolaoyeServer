# strategies.yaml — v2.2 联调用账户配置
# PUSH_MODE="local" 模式下，order_submit 需要真实的 qmt_account_id。
# 请将下方的 qmt_account_id 替换为 QMT 客户端中实际显示的证券账号。
#
# 查找方式：打开 QMT 客户端 → 交易 → 账号信息 → 证券账户号（如 "1234567890"）

account_groups:
  - group_id: real_A
    qmt_account_id: "请替换为真实QMT证券账号"
    strategies:
      - strategy_id: momentum
        virtual_initial_cash: 500000
