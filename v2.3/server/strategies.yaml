# 实际生产配置：
#   - paper_v20h: V20H CSI1000 多头 + cap_weight + vol_target（已上线）
#   - paper_v53:  V53 10 ETF 全天候双层 inv_vol（M0 dry_run, plugins/v53/config.yaml 控制）
# real_A 是历史示例策略，已废弃，不再激活
# （如需重新启用 demo 策略做联调测试，看 git 历史 commit 0936d80）

account_groups:
  - group_id: paper_v20h
    qmt_account_id: "301300148788"
    strategies:
      - strategy_id: v20h_v1_3
        virtual_initial_cash: 10000000
        # owned_symbols 未设 → null → legacy 模式 (reconcile 看到的 positions = "全部 - 其他 instance 的 owned")

  - group_id: paper_v53
    qmt_account_id: "301300148788"       # 同一 QMT 账户，server 侧逻辑隔离
    strategies:
      - strategy_id: v53
        virtual_initial_cash: 10000000
        owned_symbols:                    # 严格白名单，reconcile 只对账这 10 个
          - 510300.SH                     # hs300
          - 159915.SZ                     # cyb
          - 511260.SH                     # bond (10Y)
          - 518880.SH                     # gold
          - 159981.SZ                     # commodity2 (能源化工)
          - 159985.SZ                     # commodity3 (豆粕)
          - 159930.SZ                     # crude_oil
          - 513500.SH                     # sp500
          - 513100.SH                     # nasdaq
          - 512890.SH                     # dividend (红利低波100)

  - group_id: paper_v79
    qmt_account_id: "301300148788"
    strategies:
      # V7.13_Base replaces V79 on the existing paper_v79 client route.
      # V20H and V53 remain unchanged on the same QMT account.  Fills are
      # attributed to this virtual ledger through order_signal_map.
      - strategy_id: v713_relay
        display_name: V7.13_Base
        virtual_initial_cash: 10000000
        owned_symbols: []
        orders_enabled: true
        account_isolation: shared_ledger
        dynamic_ownership: false
        requires_reconciled_rebalance: true

# Shadow instances are intentionally outside account_groups.  They have no QMT
# identity and are processed only by ShadowLedgerService into shadow_* tables.
shadow_instances:
  - shadow_id: Shadow_Base
    mode: shadow
    orders_enabled: false
    initial_cash: 10000000
    require_sidecar: true
    max_target_age_days: 40
    target_file: plugins/v713/shadow_targets/Shadow_Base_latest.parquet
  - shadow_id: Shadow_Aux_Hard_TOP2
    mode: shadow
    orders_enabled: false
    # Active logistic plus the retained legacy TOP2 stop maps explicitly to
    # 511880.SH; this is a virtual ledger target, never a QMT order.
    enabled: true
    initial_cash: 10000000
    require_sidecar: true
    max_target_age_days: 40
    allowed_source_versions:
      - v7.9-hard-logistic-aux-top2-r1@88c2cb1050c7391ce84a9d524a9884dfefaf3ef4
    # Outside AUX_HYDRA the audited producer intentionally mirrors Base, which
    # may contain the monthly TOP50 stock universe.  Keep the ETF allowlist for
    # active TOP2 states and exempt only these two exact fallback contracts.
    allowed_symbol_fallback_state_reasons:
      - BASE:TOP50:top2_not_applicable
      - BASE:T1_5050:top2_not_applicable
    allowed_symbols:
      - 159915.SZ
      - 159930.SZ
      - 159981.SZ
      - 159985.SZ
      - 510300.SH
      - 511160.SH
      - 513100.SH
      - 513500.SH
      - 518880.SH
      - 511880.SH
      - 512400.SH
      - 512480.SH
    target_file: plugins/v713/shadow_targets/Shadow_Aux_Hard_TOP2_latest.parquet
  - shadow_id: Shadow_Aux_Hard_TOP2_ShortCredit
    mode: shadow
    orders_enabled: false
    enabled: true
    initial_cash: 10000000
    require_sidecar: true
    max_target_age_days: 40
    allowed_source_versions:
      - v7.9-hard-logistic-aux-top2-short-credit-r1@88c2cb1050c7391ce84a9d524a9884dfefaf3ef4
    allowed_symbol_fallback_state_reasons:
      - BASE:TOP50:top2_not_applicable
      - BASE:T1_5050:top2_not_applicable
    allowed_symbols:
      - 159915.SZ
      - 159930.SZ
      - 159981.SZ
      - 159985.SZ
      - 510300.SH
      - 511160.SH
      - 513100.SH
      - 513500.SH
      - 518880.SH
      - 511360.SH
      - 512400.SH
      - 512480.SH
    target_file: plugins/v713/shadow_targets/Shadow_Aux_Hard_TOP2_ShortCredit_latest.parquet
  - shadow_id: Shadow_ML_TOP2
    mode: shadow
    orders_enabled: false
    initial_cash: 10000000
    require_sidecar: true
    max_target_age_days: 40
    target_file: plugins/v713/shadow_targets/Shadow_ML_TOP2_latest.parquet
  - shadow_id: Shadow_Hydra_V481_RB
    mode: shadow
    orders_enabled: false
    initial_cash: 10000000
    # Upstream publisher: permenant_portfolio v48/publish_hydra_shadow_target.py.
    # Keep the exact audited producer commit pinned until a later revision is reviewed.
    allowed_source_versions:
      - v48.1-RB@49c16dadc298d6a51470bd5c2f931ecc36f65460
    allowed_publisher_source_commits:
      - 66985a19621e9dc8b5f2525e57ba1696fa7a9236
    require_sidecar: true
    allowed_symbols:
      - 510300.SH
      - 159915.SZ
      - 511260.SH
      - 518880.SH
      - 159981.SZ
      - 159985.SZ
      - 159930.SZ
      - 513500.SH
      - 513100.SH
    required_symbols:
      - 510300.SH
      - 159915.SZ
      - 511260.SH
      - 518880.SH
      - 159981.SZ
      - 159985.SZ
      - 159930.SZ
      - 513500.SH
      - 513100.SH
    max_target_age_days: 40
    max_price_staleness_days: 7
    # ETF 免印花税；佣金按单边万一、每笔最低 5 元做影子估算。
    commission_rate: 0.0001
    min_commission: 5.0
    stamp_duty_sell: 0.0
    lot_size: 100
    target_file: plugins/v713/shadow_targets/Shadow_Hydra_V481_RB_latest.parquet
