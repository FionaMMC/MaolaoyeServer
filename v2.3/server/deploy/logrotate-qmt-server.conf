# 装到 /etc/logrotate.d/qmt-server
#
# server.log 由 systemd 用 root 身份 append（StandardOutput=append:），
# 所以这里 logrotate 也用 root 跑（默认），不加 su 指令。
# copytruncate：拷副本 + 原文件 truncate，systemd 持有的 fd 仍然有效。

/var/log/qmt-server/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
