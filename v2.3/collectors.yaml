# v2.3 采集任务清单
# 声明所有数据源及其采集频率、参数

# ── 全局设置 ──────────────────────────────────────────────────────────────────
settings:
  data_root: "data"          # 数据存储根目录（相对于 v2.3 目录）
  qmt_data_dir: "C:\\parttime\\平安证券量盈QMT策略交易平台\\userdata_mini"
  parquet_compression: snappy

# ── 采集频率定义（collector 名 → frequency）────────────────────────────────────
frequencies:
  daily:
    - market_ohlcv
    - convertible_bonds
    - index_weights
    - macro_lpr
    - macro_shibor
    - macro_margin
    - sector_list
    - trading_calendar
  weekly:
    - dividends
    - etf_pc
    - futures
  monthly:
    - instruments
    - industry_map       # 行业映射随元数据月度更新
    - financial_tables
    - macro_cpi
    - macro_pmi
    - macro_money_supply
    - macro_social_finance
    - macro_trade_balance
    - macro_industrial_production
    - macro_house_price
    - macro_electricity
    - macro_unemployment
    - macro_gold_fx
    - macro_pboc_balance
    - macro_real_estate
    - macro_bond_yield
    - macro_insurance
    - macro_global
  quarterly:
    - macro_gdp

# ── QMT 行情 · 股票/ETF/指数 OHLCV ─────────────────────────────────────────────
market_ohlcv:
  enabled: true
  description: "股票+ETF+指数 日线 OHLCV（前复权）"
  stock_sector: "沪深A股"
  etf_sectors: ["沪深ETF"]
  index_codes:
    - "000001.SH"    # 上证指数
    - "000002.SH"    # 上证A指
    - "000003.SH"    # 上证B指
    - "000016.SH"    # 上证50
    - "000300.SH"    # 沪深300
    - "000688.SH"    # 科创50
    - "000852.SH"    # 中证1000
    - "000905.SH"    # 中证500
    - "000906.SH"    # 中证800
    - "399001.SZ"    # 深证成指
    - "399005.SZ"    # 中小100
    - "399006.SZ"    # 创业板指
    - "399016.SZ"    # 深证创新
    - "399102.SZ"    # 创业板综
    - "399330.SZ"    # 深证100
    - "399905.SZ"    # 中证500（深）
    - "399852.SZ"    # 中证1000（深）
  download_sleep_seconds: 3
  dividend_types:            # 复权类型（股票/ETF 用 front，指数用 none）
    stocks: "front"          # 前复权（默认，对接服务器策略）
    etfs: "front"
    indexes: "none"          # 指数不复权
    # 如需后复权/不复权股票数据，改为 ["front","back","none"] 三元组

# ── QMT 行情 · 可转债 ──────────────────────────────────────────────────────────
convertible_bonds:
  enabled: true
  description: "可转债日线 OHLCV（不复权）"
  sector: "沪深转债"
  download_sleep_seconds: 3

# ── QMT 行情 · 期货 ────────────────────────────────────────────────────────────
futures:
  enabled: true
  description: "主力合约期货日线 OHLCV"
  sectors:
    - "金融期货"
    - "商品期货"
    - "农产品期货"
  download_sleep_seconds: 3

# ── QMT 财务数据 ──────────────────────────────────────────────────────────────
financial_tables:
  enabled: true
  description: "财务数据 7 张表（利润表/资产负债表/现金流量表/每股指标/股本/股东人数/十大股东）"
  tables:
    - Income
    - Balance
    - CashFlow
    - PershareIndex
    - Capital
    - HolderNum
    - Top10Holder
  start_time: ""          # 空 = 下载全量；"20200101" = 从2020年起
  download_sleep_seconds: 5
  batch_size: 100         # 每批下载的股票数（避免内存溢出）

# ── QMT 分红送配 ──────────────────────────────────────────────────────────────
dividends:
  enabled: true
  description: "分红送配因子（除权除息/送转股/配股/股息）"

# ── QMT 品种元数据 ────────────────────────────────────────────────────────────
instruments:
  enabled: true
  description: "品种基础信息（名称/市值/股本/ST状态/上市日等）"
  invalidate_days: 30     # 30天后重新拉取元数据

# ── QMT 行业/板块映射 ─────────────────────────────────────────────────────────
industry_map:
  enabled: true
  description: "每只股票 → 所属行业/板块/概念/地域分类映射"
  classifications:          # 采集哪些分类体系
    - pattern: "SW1"        # 申万一级行业
    - pattern: "SW2"        # 申万二级行业
    - pattern: "CSRC1"      # 证监一级
    - pattern: "CSRC2"      # 证监二级
    - pattern: "GICS1"      # 全球行业分类一级
    - pattern: "DY1"        # 省份
    - pattern: "DY2"        # 城市
    - pattern: "SW3"        # 申万三级（粒度细，可选）

# ── QMT 指数权重 ──────────────────────────────────────────────────────────────
index_weights:
  enabled: true
  description: "核心指数成分股及权重"
  indexes:
    - "000016.SH"    # 上证50
    - "000300.SH"    # 沪深300
    - "000852.SH"    # 中证1000
    - "000905.SH"    # 中证500
    - "000688.SH"    # 科创50
    - "399006.SZ"    # 创业板指
    - "399330.SZ"    # 深证100

# ── QMT ETF 申赎清单 ─────────────────────────────────────────────────────────
etf_pc:
  enabled: true
  description: "ETF 申购赎回清单（PCF），含净值与成分股"
  etf_sector: "沪深ETF"
  top_n: 200           # 仅采集规模最大的前 N 只 ETF

# ── QMT 板块/行业/概念/地域 ──────────────────────────────────────────────────
sector_list:
  enabled: true
  description: "所有板块/行业/概念/地域分类的完整列表及成分股数量"

# ── 交易日历 ──────────────────────────────────────────────────────────────────
trading_calendar:
  enabled: true
  description: "交易日历缓存"
  years_ahead: 1       # 缓存未来 N 年的交易日

